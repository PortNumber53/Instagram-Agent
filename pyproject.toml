[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-agent"
version = "0.2.0"
description = "An Instagram Agent to generate content and publish directly via the Facebook Graph API"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    "mflux>=0.13.0",
    "flask>=3.0.0",
]

[project.scripts]
instagram-agent = "instagram_agent.cli:main"

[tool.setuptools]
packages = ["instagram_agent", "instagram_agent.image_gen"]
package-dir = {"" = "src"}
