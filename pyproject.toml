[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-agent"
version = "0.1.0"
description = "An Instagram Agent to generate content and post autonomously"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
instagram-agent = "instagram_agent.cli:main"

[tool.setuptools]
packages = ["instagram_agent"]
package-dir = {"" = "src"}
